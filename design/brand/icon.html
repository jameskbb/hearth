<!doctype html>
<!-- Legacy (pre-adaptive) launcher icon: icon.svg's inner 80x80 of the 108
     canvas in a rounded square, laid out at 192x192 (xxxhdpi). Rendered by
     scripts/render-brand.sh into the mipmap-*dpi folders. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .icon { position: relative; width: 192px; height: 192px; border-radius: 40px; overflow: hidden; }
  .icon img { position: absolute; left: -33.6px; top: -33.6px; width: 259.2px; height: 259.2px; }
</style>
</head>
<body>
  <div class="icon"><img src="icon.svg" alt=""></div>
</body>
</html>
