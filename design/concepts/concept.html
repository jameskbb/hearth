<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=960, height=540">
<title>Hearth concepts</title>
<!-- Concept prototype only. Laid out in Fire TV dp (960x540); rendered at 2x = 1920x1080.
     Everything here maps to Compose: layered bitmaps, linear/radial brushes, scale, border, shadow. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400&family=Instrument+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=block" rel="stylesheet">
<style>
  :root { --mx: 48px; --my: 32px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 540px; overflow: hidden; background: #000; }
  body { position: relative; -webkit-font-smoothing: antialiased; }

  .art { position: absolute; inset: 0; }
  .art svg { width: 100%; height: 100%; display: block; }
  /* Fine grain to break up gradient banding (baked into the bitmap natively). */
  .grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }

  /* Localized shading: only behind the controls. */
  .shade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 250px;
    background: linear-gradient(to top, var(--shade) 0%, var(--shade-mid) 45%, transparent 100%); }
  .shade-clock { position: absolute; left: -120px; top: -120px; width: 460px; height: 300px;
    background: radial-gradient(closest-side, var(--shade-mid), transparent); }

  .clock { position: absolute; left: var(--mx); top: var(--my); color: var(--ink); }
  .time { font: 300 44px/1 var(--display); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .date { font: 400 13px/1.4 var(--text); opacity: .78; margin-top: 6px; }

  .dock { position: absolute; left: var(--mx); right: 0; bottom: var(--my); }
  .focus-name { font: 400 30px/1.05 var(--display); color: var(--ink); letter-spacing: -0.005em; }
  .focus-hint { font: 400 12px/1.4 var(--text); color: var(--ink); opacity: .7; margin: 6px 0 14px; }

  .row { display: flex; gap: 20px; align-items: center; height: 124px; }
  .tile { flex: none; width: 184px; height: 104px; border-radius: 10px; position: relative;
    display: flex; align-items: flex-end; padding: 10px 12px; overflow: hidden;
    background: var(--tile-bg); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .tile .mono { position: absolute; right: 12px; top: 8px; font: 600 34px/1 var(--text); opacity: .22; }
  .tile .lbl { font: 600 14px/1 var(--text); letter-spacing: .01em; }
  .tile.focused { transform: scale(1.08); transform-origin: center;
    box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 0 4px var(--accent), 0 14px 34px var(--glow); }

  .actions { display: flex; gap: 28px; margin-top: 14px; font: 500 14px/1 var(--text); color: var(--ink); }
  .actions span { opacity: .72; padding: 6px 0; }

  /* ---------- Concept 1: cinematic sunset ---------- */
  body.sunset { --display: 'Literata', serif; --text: 'Instrument Sans', sans-serif;
    --ink: #FFF3E4; --accent: #FFB45C; --glow: rgba(255,150,70,.45);
    --shade: rgba(10,14,36,.88); --shade-mid: rgba(10,14,36,.45); }

  /* ---------- Concept 2: aurora ---------- */
  body.aurora { --display: 'Bricolage Grotesque', sans-serif; --text: 'Bricolage Grotesque', sans-serif;
    --ink: #EAF6F1; --accent: #3FE0A1; --glow: rgba(63,224,161,.38);
    --shade: rgba(5,10,24,.9); --shade-mid: rgba(5,10,24,.45); }
  body.aurora .time { font-weight: 300; letter-spacing: -0.03em; }

  /* ---------- Concept 3: gallery ---------- */
  body.gallery { --display: 'Instrument Sans', sans-serif; --text: 'Instrument Sans', sans-serif;
    --ink: #F3EEE6; --accent: #F3EEE6; --glow: rgba(243,238,230,.22);
    --shade: rgba(8,10,14,.82); --shade-mid: rgba(8,10,14,.35); }
  body.gallery .shade-bottom { height: 175px; }
  body.gallery .time { font: 400 22px/1 var(--text); }
  body.gallery .date { display: none; }
  body.gallery .focus-name { font: 500 17px/1 var(--text); }
  body.gallery .focus-hint { margin: 4px 0 10px; }
  body.gallery .row { height: 84px; gap: 14px; }
  body.gallery .tile { width: 128px; height: 72px; border-radius: 7px; padding: 7px 9px; }
  body.gallery .tile .mono { font-size: 24px; }
  body.gallery .tile .lbl { font-size: 11px; }
  body.gallery .actions { display: none; }
  .placard { display: none; }
  body.gallery .placard { display: block; position: absolute; right: var(--mx); top: var(--my);
    text-align: right; color: var(--ink); }
  .placard .t { font: italic 400 15px/1.3 'Newsreader', serif; }
  .placard .s { font: 400 11px/1.4 var(--text); opacity: .65; }
</style>
</head>
<body class="sunset">
  <div class="art" id="art"></div>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="shade-clock"></div>
  <div class="shade-bottom"></div>

  <div class="clock"><div class="time">8:42</div><div class="date">Tuesday, October 21</div></div>
  <div class="placard"><div class="t">Blue hour over the ridge</div><div class="s">Hearth wallpaper</div></div>

  <div class="dock">
    <div class="focus-name">Netflix</div>
    <div class="focus-hint">Press ☰ for options</div>
    <div class="row">
      <div class="tile focused" style="--tile-bg:linear-gradient(135deg,#7a1018,#2b0508)"><span class="mono">N</span><span class="lbl">Netflix</span></div>
      <div class="tile" style="--tile-bg:linear-gradient(135deg,#8a1d1d,#3a0c0c)"><span class="mono">Y</span><span class="lbl">YouTube</span></div>
      <div class="tile" style="--tile-bg:linear-gradient(135deg,#123a7a,#08173a)"><span class="mono">D</span><span class="lbl">Disney+</span></div>
      <div class="tile" style="--tile-bg:linear-gradient(135deg,#0f6b45,#052d1d)"><span class="mono">H</span><span class="lbl">Hulu</span></div>
      <div class="tile" style="--tile-bg:linear-gradient(135deg,#1c5e3a,#0a2416)"><span class="mono">S</span><span class="lbl">Spotify</span></div>
      <div class="tile" style="--tile-bg:linear-gradient(135deg,#3c3f8a,#15173a)"><span class="mono">T</span><span class="lbl">YouTube TV</span></div>
    </div>
    <div class="actions"><span>All apps</span><span>Settings</span></div>
  </div>

<template id="art-sunset">
<svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1233"/><stop offset=".32" stop-color="#26255E"/>
      <stop offset=".5" stop-color="#6A2E6B"/><stop offset=".62" stop-color="#D2553F"/>
      <stop offset=".7" stop-color="#FFA64D"/><stop offset=".74" stop-color="#FFD08A"/>
    </linearGradient>
    <radialGradient id="sun" cx="640" cy="392" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7B0" stop-opacity="1"/><stop offset=".08" stop-color="#FFC56E" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#FF8A45" stop-opacity=".35"/><stop offset="1" stop-color="#FF6A3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2A63"/><stop offset="1" stop-color="#1E1B45"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22204A"/><stop offset="1" stop-color="#121433"/></linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121535"/><stop offset="1" stop-color="#0A0D24"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <rect width="960" height="540" fill="url(#sun)"/>
  <circle cx="640" cy="396" r="22" fill="#FFF1CF"/>
  <g filter="url(#soft)" opacity=".55">
    <path d="M0 250 C200 236 420 262 960 232 L960 246 C520 276 260 258 0 268Z" fill="#FF9E6B"/>
    <path d="M120 300 C380 288 600 312 960 296 L960 304 C600 322 360 300 120 310Z" fill="#FFC08A"/>
  </g>
  <path d="M0 392 L70 372 L130 384 L210 352 L290 380 L360 362 L430 386 L520 368 L600 398 L700 380 L780 392 L870 366 L960 382 L960 540 L0 540Z" fill="url(#r1)" opacity=".92"/>
  <path d="M0 430 L90 404 L170 424 L260 396 L350 428 L450 408 L540 436 L640 414 L740 440 L830 418 L960 432 L960 540 L0 540Z" fill="url(#r2)"/>
  <path d="M0 470 L120 452 L240 474 L380 450 L520 478 L660 458 L800 480 L960 462 L960 540 L0 540Z" fill="url(#r3)"/>
</svg>
</template>

<template id="art-aurora">
<svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A1C"/><stop offset=".55" stop-color="#0B1834"/><stop offset=".8" stop-color="#0F2440"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7CFF" stop-opacity="0"/><stop offset=".2" stop-color="#8E7CFF" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#3FE0A1" stop-opacity=".95"/><stop offset=".8" stop-color="#1FB98A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1FB98A" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="14 30"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="5 18"/></filter>
    <radialGradient id="glowlow" cx="480" cy="420" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D6B5A" stop-opacity=".5"/><stop offset="1" stop-color="#1D6B5A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="url(#nsky)"/>

  <g fill="#DCE8FF">

    <circle cx="590" cy="22" r=".7"/><circle cx="720" cy="58" r="1"/><circle cx="860" cy="34" r=".7"/><circle cx="910" cy="110" r=".6"/>
    <circle cx="150" cy="150" r=".5"/><circle cx="640" cy="130" r=".5"/><circle cx="780" cy="160" r=".6"/><circle cx="40" cy="120" r=".5"/>
  </g>
  <g filter="url(#blur1)" opacity=".85">
    <path d="M-40 250 C120 150 260 120 380 170 C520 230 600 120 760 110 C860 104 920 150 1000 140 L1000 260 C900 250 820 230 740 250 C600 290 520 310 380 280 C240 250 120 300 -40 330Z" fill="url(#band)"/>
  </g>
  <g filter="url(#blur2)" opacity=".7">
    <path d="M300 300 C380 220 460 170 560 160 C640 152 700 190 760 170 L770 186 C700 214 640 184 560 196 C470 210 400 260 320 320Z" fill="#7CF5C4"/>
    <path d="M560 70 C640 90 700 60 800 80 L800 96 C700 84 640 112 560 92Z" fill="#A99BFF" opacity=".6"/>
  </g>
  <path d="M0 448 L30 430 L44 446 L62 418 L80 444 L104 424 L124 448 L150 412 L176 446 L206 430 L230 450 L262 420 L292 452 L330 436 L360 456 L400 440 L460 458 L540 444 L620 460 L700 438 L760 456 L800 426 L828 452 L860 432 L890 454 L930 428 L960 446 L960 540 L0 540Z" fill="#040814"/>
</svg>
</template>

<template id="art-gallery">
<svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294F"/><stop offset=".45" stop-color="#3D5C8C"/><stop offset=".62" stop-color="#9AA6C4"/><stop offset=".7" stop-color="#E9B98F"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A486"/><stop offset=".25" stop-color="#5E6F94"/><stop offset="1" stop-color="#101C33"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6E96"/><stop offset="1" stop-color="#3E4E73"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3B5C"/><stop offset="1" stop-color="#1B2541"/></linearGradient>

  <g opacity=".22" transform="translate(0 756) scale(1 -1)">
    <path d="M0 372 L90 330 L190 352 L300 318 L420 356 L520 334 L640 362 L760 330 L880 356 L960 340 L960 380 L0 380Z" fill="#1B2541"/>
  </g>
  <rect y="378" width="960" height="1.2" fill="#F4D6B6" opacity=".55"/>
</svg>
</template>

<script>
  const theme = new URLSearchParams(location.search).get('theme') || 'sunset';
  document.body.className = theme;
  document.getElementById('art').innerHTML = document.getElementById('art-' + theme).innerHTML;
</script>
</body>
</html>
