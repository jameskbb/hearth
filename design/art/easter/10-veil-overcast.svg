<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" data-scale="0.5">
  <!-- A soft pearl spring cloud deck for overcast and rain, at quarter size
       because it is all soft gradient. It lightens the high sky to silver
       and thins toward the hills so the dawn glow still warms the horizon. -->
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C5065" stop-opacity="0.46"/>
      <stop offset="0.35" stop-color="#7F8E9A" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#D4C4BE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8D2C2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dawn" gradientUnits="userSpaceOnUse" cx="656" cy="290" r="300">
      <stop offset="0" stop-color="#F6DCC2" stop-opacity="0.36"/>
      <stop offset="0.45" stop-color="#EBCBBE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#EBCBBE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4C4CA" stop-opacity="0"/>
      <stop offset="1" stop-color="#EAD9D4" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="8 5"/></filter>
  </defs>
  <rect width="960" height="290" fill="url(#deck)"/>
  <g fill="url(#belly)" filter="url(#soft)">
    <path d="M420 86 C480 72 540 82 600 76 C660 68 720 82 780 74 C840 66 900 78 980 72 L980 106 C900 114 840 104 780 110 C720 116 660 106 600 112 C540 118 480 110 420 108Z" opacity="0.2"/>
    <path d="M-20 150 C40 138 100 148 160 140 C220 132 280 146 340 140 C380 136 410 140 440 148 C400 158 350 154 300 160 C240 166 180 158 120 164 C60 170 20 162 -20 166Z" opacity="0.12"/>
    <path d="M260 214 C330 202 400 212 470 206 C550 198 630 212 710 204 C790 196 870 208 980 200 L980 226 C870 234 790 224 710 230 C630 236 550 228 470 234 C400 240 330 232 260 230Z" opacity="0.45"/>
  </g>
  <rect width="960" height="290" fill="url(#dawn)"/>
</svg>
