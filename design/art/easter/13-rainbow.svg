<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 120 960 180" data-scale="0.5">
  <!-- A faint pastel rainbow above the far hills, the hopeful note of a
       spring shower. It rises clear of the clock and fades out before its
       foot reaches the app name. Quarter size: soft bands only. -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="foot" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="285">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ends" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.68" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="120" width="960" height="180">
      <rect x="0" y="120" width="960" height="180" fill="url(#foot)"/>
    </mask>
    <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="120" width="960" height="180">
      <rect x="0" y="120" width="960" height="180" fill="url(#ends)"/>
    </mask>
  </defs>
  <g mask="url(#m2)"><g mask="url(#m)"><g fill="none" filter="url(#soft)" opacity="0.2">
    <circle cx="420" cy="470" r="318" stroke="#E7A3A0" stroke-width="5"/>
    <circle cx="420" cy="470" r="313" stroke="#EBC79A" stroke-width="5"/>
    <circle cx="420" cy="470" r="308" stroke="#E8E2A6" stroke-width="5"/>
    <circle cx="420" cy="470" r="303" stroke="#A9CFA8" stroke-width="5"/>
    <circle cx="420" cy="470" r="298" stroke="#9EC0D8" stroke-width="5"/>
    <circle cx="420" cy="470" r="293" stroke="#B5A7D2" stroke-width="5"/>
  </g></g></g>
</svg>
