<svg xmlns="http://www.w3.org/2000/svg" width="960" height="130" viewBox="0 300 960 130" data-scale="0.5">
  <!-- Low mist over the near meadow that parts around the eggs, leaving
       the blossom tree in thinner mist. Quarter size: soft gradient only. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE4DA" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#EDE4DA" stop-opacity="0.24"/>
      <stop offset="0.65" stop-color="#E2DCD2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E2DCD2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#fff"/>
    </linearGradient>
    <filter id="feather" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <mask id="m">
      <rect x="0" y="300" width="960" height="130" fill="url(#side)"/>
      <g fill="#000" filter="url(#feather)">
        <ellipse cx="745" cy="300" rx="80" ry="30"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="300" width="960" height="130" fill="url(#band)" mask="url(#m)"/>
</svg>
