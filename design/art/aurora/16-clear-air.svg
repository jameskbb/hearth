<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-scale="1">
  <!-- Hearth theme "Aurora", weather layer: cold clear air. The zenith deepens to a richer, more saturated
       blue, and a clean, glassy band of cyan-teal light hugs the treeline. Half resolution. -->
  <defs>
    <linearGradient id="z" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10286E" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#10286E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#10286E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="330" x2="0" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FE0D8" stop-opacity="0"/>
      <stop offset=".55" stop-color="#6FE0D8" stop-opacity=".16"/>
      <stop offset=".8" stop-color="#8FEAE6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#A8F0EC" stop-opacity=".52"/>
    </linearGradient>
    <radialGradient id="r" cx="520" cy="430" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </radialGradient>
    <filter id="tree" x="-5%" y="-50%" width="110%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".09 .02" numOctaves="3" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- The band lies behind the trees: layer 00's treeline cuts it off. -->
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="330" width="960" height="210">
      <rect y="330" width="960" height="210" fill="url(#r)"/>
      <g filter="url(#tree)" fill="#000"><path d="M-40 430 C40 424 70 420 110 424 C160 428 200 414 250 418 C310 422 350 432 410 428 C470 424 520 432 580 430 C650 428 700 418 760 422 C820 426 880 414 960 420 L1000 540 L1000 600 L-40 600 L-40 540Z"/></g>
    </mask>
  </defs>
  <rect width="960" height="270" fill="url(#z)"/>
  <rect y="330" width="960" height="120" fill="url(#g)" mask="url(#m)"/>
</svg>
