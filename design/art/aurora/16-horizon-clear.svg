<svg xmlns="http://www.w3.org/2000/svg" width="960" height="110" viewBox="0 330 960 110" data-scale="1">
  <!-- Hearth theme "Aurora", weather layer: cold clear air. A cool, clear band of blue-green light along the
       treeline, as on a still night with frost coming. -->
  <defs>
    <linearGradient id="g" x1="0" y1="330" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD6D0" stop-opacity="0"/>
      <stop offset=".65" stop-color="#6CC7C9" stop-opacity=".16"/>
      <stop offset=".86" stop-color="#9ADBE0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#9ADBE0" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="r" cx="520" cy="430" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </radialGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="330" width="960" height="110"><rect y="330" width="960" height="110" fill="url(#r)"/></mask>
  </defs>
  <rect y="330" width="960" height="110" fill="url(#g)" mask="url(#m)"/>
</svg>
