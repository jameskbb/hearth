<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid slice">
  <!-- Hearth theme "Aurora", layer 00: the base. Rendered by scripts/render-theme.sh aurora.
       Split from design/art/aurora.svg: night sky, low glow, stars and treeline; the curtain is layer 01. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040919"/>
      <stop offset=".5" stop-color="#0A1631"/>
      <stop offset=".78" stop-color="#0E2640"/>
    </linearGradient>
    <radialGradient id="low" cx="520" cy="430" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F7A63" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1F7A63" stop-opacity="0"/>
    </radialGradient>
    <filter id="tree" x="-5%" y="-50%" width="110%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".09 .02" numOctaves="3" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="13" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <rect width="960" height="540" fill="url(#low)"/>

  <g fill="#DCE6FF">
    <circle cx="70" cy="42" r=".75"/><circle cx="196" cy="96" r=".55"/><circle cx="318" cy="30" r=".85"/><circle cx="452" cy="62" r=".55"/>
    <circle cx="588" cy="24" r=".7"/><circle cx="706" cy="52" r=".95"/><circle cx="842" cy="36" r=".65"/><circle cx="912" cy="104" r=".55"/>
    <circle cx="140" cy="160" r=".45"/><circle cx="262" cy="196" r=".4"/><circle cx="886" cy="176" r=".45"/><circle cx="36" cy="128" r=".5"/>
    <circle cx="520" cy="110" r=".4"/><circle cx="760" cy="128" r=".45"/>
  </g>

  <g filter="url(#tree)" fill="#030612">
    <path d="M-40 430 C40 424 70 420 110 424 C160 428 200 414 250 418 C310 422 350 432 410 428 C470 424 520 432 580 430 C650 428 700 418 760 422 C820 426 880 414 960 420 L1000 540 L1000 600 L-40 600 L-40 540Z"/>
  </g>

  <rect width="960" height="540" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>
