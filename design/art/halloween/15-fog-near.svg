<svg xmlns="http://www.w3.org/2000/svg" width="960" height="140" viewBox="0 290 960 140" data-scale="0.5">
  <!-- Low fog drifting over the near ground in front of the maze. It parts
       around the pumpkins so their candlelight stays warm and clear.
       Quarter size: soft gradient only. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D4CE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#C3D4CE" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#B5C7C2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A9BCB8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="0.62" stop-color="#fff"/>
    </linearGradient>
    <filter id="feather" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <mask id="m">
      <rect x="0" y="290" width="960" height="140" fill="url(#side)"/>
      <ellipse cx="820" cy="300" rx="140" ry="44" fill="#000" filter="url(#feather)"/>
    </mask>
  </defs>
  <rect x="0" y="290" width="960" height="140" fill="url(#band)" mask="url(#m)"/>
</svg>
