    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(.59 .47) scale(.24 .17)">
      <stop stop-color="#F0C985" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#E9B968" stop-opacity=".09"/>
      <stop offset="1" stop-color="#E9B968" stop-opacity="0"/>
