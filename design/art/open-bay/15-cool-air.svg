<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-scale="1">
  <!-- Hearth theme "Open Bay", weather layer: a cold, clear afternoon. The air in the bay turns crisp and blue,
       the haze lifts off the hills and the sky behind the trees reads clear. Half resolution. -->
  <defs>
    <clipPath id="bay"><rect x="517.5" y="145" width="265" height="178"/></clipPath>
    <!-- The doorway, feathered about 10 dp into the jambs and over the threshold so no clip edge shows. -->
    <filter id="feath" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="baym" maskUnits="userSpaceOnUse" x="480" y="110" width="340" height="250">
      <rect x="517.5" y="145" width="265" height="178" fill="#fff" filter="url(#feath)"/>
      <rect x="523" y="150" width="254" height="168" fill="#fff"/>
    </mask>
    <linearGradient id="g" x1="0" y1="145" x2="0" y2="323" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9CBEA" stop-opacity=".58"/>
      <stop offset=".45" stop-color="#B4CFE6" stop-opacity=".36"/>
      <stop offset="1" stop-color="#BFD3E4" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <g mask="url(#baym)">
    <rect x="500" y="130" width="300" height="210" fill="url(#g)"/>
  </g>
</svg>
