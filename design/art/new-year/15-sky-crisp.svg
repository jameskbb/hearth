<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" data-scale="0.5">
  <!-- Freezing clear air, at quarter size because it is soft gradient only:
       the midnight sky opens to a clearer, brighter blue. -->
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C4F8A" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3F6A92" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6E90A4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" fill="url(#air)"/>
</svg>
