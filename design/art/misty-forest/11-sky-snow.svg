<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" data-scale="1">
  <!-- Misty Forest weather sky: snow and snow on the way. An opaque sky drawn at half size (data-scale 1) over the base sky, from 00-sky.svg: a high, bright snow sky, lavender pearl overhead and luminous white low down, with a rose-gold glow where the sun is. The farthest ridge is painted here as on the base. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323C54"/>
      <stop offset="0.2" stop-color="#4E5872"/>
      <stop offset="0.34" stop-color="#8C94A8"/>
      <stop offset="0.44" stop-color="#BCC0CA"/>
      <stop offset="0.51" stop-color="#DADAD8"/>
      <stop offset="0.58" stop-color="#E6E2DA"/>
      <stop offset="1" stop-color="#C4CACE"/>
    </linearGradient>
    <radialGradient id="sun" cx="640" cy="236" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2E4" stop-opacity="0.85"/>
      <stop offset="0.08" stop-color="#F8E2D2" stop-opacity="0.6"/>
      <stop offset="0.3" stop-color="#E8D6CC" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#D8D0CC" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#D8D0CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="120" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2234" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1C2234" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0B6C2"/>
      <stop offset="1" stop-color="#D2D4D6"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .05" numOctaves="4" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
    <filter id="disc" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="b7" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="b9" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b10" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <rect width="960" height="540" fill="url(#cool)"/>
  <rect width="960" height="540" fill="url(#sun)"/>
  <circle cx="640" cy="226" r="14" fill="#FFF8E8" opacity=".6" filter="url(#disc)"/>

