<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" data-scale="1">
  <!-- The sun as a pale disc through cloud or fog, with a wide soft halo. -->
  <defs>
    <radialGradient id="halo" cx="730" cy="118" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBEC" stop-opacity="0.6"/>
      <stop offset="0.3" stop-color="#FBF6E6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F2F2E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <circle cx="730" cy="118" r="160" fill="url(#halo)"/>
  <circle cx="730" cy="118" r="17" fill="#FFFDF4" opacity="0.82" filter="url(#blur)"/>
</svg>
