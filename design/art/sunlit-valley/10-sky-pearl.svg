<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" data-scale="1">
  <!-- Bright overcast: a soft blue-gray ceiling over a pearl horizon, the sun's light still diffusing through. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D6E9B"/>
      <stop offset="0.24" stop-color="#6690B3"/>
      <stop offset="0.56" stop-color="#B9CFD8"/>
      <stop offset="0.78" stop-color="#DCE7E3"/>
      <stop offset="1" stop-color="#EEF1E2"/>
    </linearGradient>
    <radialGradient id="sun" cx="76%" cy="20%" r="48%">
      <stop offset="0" stop-color="#FFF9E8" stop-opacity="0.62"/>
      <stop offset="0.35" stop-color="#F4F2E4" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#E6EEEA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceiling" cx="10%" cy="0%" r="62%">
      <stop offset="0" stop-color="#2F6595" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3D6E9B" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3D6E9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftcool" x1="0.1" y1="0" x2="0.9" y2="0">
      <stop offset="0" stop-color="#6B98B8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7AA3C0" stop-opacity="0.34"/>
      <stop offset="0.78" stop-color="#7EA2BE" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <ellipse cx="200" cy="150" rx="260" ry="34" fill="#C9D8DF" opacity="0.32"/>
    <ellipse cx="620" cy="118" rx="300" ry="30" fill="#F2F4EC" opacity="0.30"/>
    <ellipse cx="420" cy="232" rx="340" ry="30" fill="#E9EFEB" opacity="0.34"/>
    <ellipse cx="840" cy="262" rx="220" ry="26" fill="#F6F5EA" opacity="0.30"/>
    <ellipse cx="640" cy="300" rx="200" ry="22" fill="#EEF2EA" opacity="0.30"/>
    <ellipse cx="360" cy="64" rx="320" ry="26" fill="#5F87AA" opacity="0.26"/>
  </g>
  <rect x="-120" y="190" width="1200" height="240" fill="url(#leftcool)" filter="url(#soft)"/>
  <rect width="960" height="540" fill="url(#ceiling)"/>
  <rect width="960" height="540" fill="url(#sun)"/>
</svg>
