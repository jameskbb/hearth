<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 320 960 170" data-scale="1">
  <!-- Luminous valley fog: bright, sun-warmed banks lying in the folds. Repeats left to right. -->
  <defs>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FBFAF1" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#F1F4EE" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#E8EFEC" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="banks">
      <ellipse cx="120" cy="392" rx="210" ry="22"/>
      <ellipse cx="470" cy="410" rx="240" ry="20"/>
      <ellipse cx="800" cy="384" rx="220" ry="24"/>
      <ellipse cx="300" cy="442" rx="200" ry="14"/>
      <ellipse cx="680" cy="446" rx="190" ry="14"/>
    </g>
  </defs>
  <g fill="url(#bank)" filter="url(#soft)">
    <use href="#banks"/><use href="#banks" x="-960"/><use href="#banks" x="960"/>
  </g>
</svg>
