<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 60 960 200" data-scale="1">
  <!-- Snow sky: a low, soft deck of pearl cloud rolls above the range, lit from above. Repeats left to right. -->
