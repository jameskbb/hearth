  <!-- Hearth theme "Desert Twilight", weather layer 16: nearer falling snow, fewer and larger flakes, on transparent.
       Rendered at 1x (960 px wide) by scripts/render-theme.sh and scaled up. A 270 dp tile, repeated down the screen. It tiles both ways (every flake
       near an edge is repeated across it), so it can fall and drift without a seam. Sparse and soft, so
