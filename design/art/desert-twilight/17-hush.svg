<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 140 960 240" data-scale="1">
  <!-- Hearth theme "Desert Twilight", weather layer 17: the hush before snow, on transparent. Rendered at a quarter
       size (480 px wide, a smooth gradient) by scripts/render-theme.sh desert-twilight and scaled up. A soft
       pearl-rose veil over the lower sky and the far mesas, as when a snow sky holds the last light; it thins
       toward the left, where the app name sits. -->
  <defs>
    <linearGradient id="veil" x1="0" y1="140" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8B4D4" stop-opacity="0"/>
      <stop offset=".35" stop-color="#D8BCD0" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#F0CCCC" stop-opacity=".4"/>
      <stop offset=".72" stop-color="#E0C6DC" stop-opacity=".22"/>
      <stop offset=".85" stop-color="#B8B0DA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="660" cy="290" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(660 290) scale(1.3 .28) translate(-660 -290)">
      <stop offset="0" stop-color="#FFE8D0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFE8D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".66" stop-color="#fff"/>
    </linearGradient>
    <mask id="lean" maskUnits="userSpaceOnUse" x="0" y="140" width="960" height="240">
      <rect x="0" y="140" width="960" height="240" fill="url(#side)"/>
    </mask>
  </defs>
  <rect x="0" y="140" width="960" height="240" fill="url(#veil)" mask="url(#lean)"/>
  <rect x="0" y="140" width="960" height="240" fill="url(#sun)"/>
</svg>
