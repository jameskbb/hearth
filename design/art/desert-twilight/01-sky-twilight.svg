<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Hearth theme "Desert Twilight", layer 01: the same sky after sunset, opaque and full size. Rendered by
       scripts/render-theme.sh desert-twilight. It fades in over the day sky a while after the theme appears.
       Deep indigo overhead, violet, then a warm orange band where the sun went down, right of center. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0B26"/>
      <stop offset=".2" stop-color="#1A1440"/>
      <stop offset=".34" stop-color="#2E1E58"/>
      <stop offset=".44" stop-color="#5A2E6A"/>
      <stop offset=".5" stop-color="#9C4466"/>
      <stop offset=".545" stop-color="#D9674E"/>
      <stop offset=".575" stop-color="#F08A50"/>
      <stop offset="1" stop-color="#C8643F"/>
    </linearGradient>
    <radialGradient id="afterglow" cx="660" cy="300" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC27A" stop-opacity=".8"/>
      <stop offset=".1" stop-color="#FF9A5A" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#E0605A" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#8A3A70" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8A3A70" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <rect width="960" height="540" fill="url(#afterglow)"/>

  <rect width="960" height="540" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>
