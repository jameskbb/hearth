<svg xmlns="http://www.w3.org/2000/svg" width="480" height="140" viewBox="0 130 960 280" data-scale="1">
  <!-- Hearth theme "Desert Twilight", weather layer 21: the golden haze of a hot desert evening, on transparent.
       Rendered at a quarter size (480 px wide, a smooth gradient) by scripts/render-theme.sh desert-twilight and
       scaled up. Dust still warm from the day spreads the afterglow wide and lays a honeyed veil on the far mesas;
       it is drawn under the near terrain, which keeps its depth behind the dock, and thins toward the left, where the app name sits. -->
  <defs>
    <radialGradient id="bloom" cx="660" cy="292" r="420" gradientUnits="userSpaceOnUse" gradientTransform="translate(660 292) scale(1.5 .28) translate(-660 -292)">
      <stop offset="0" stop-color="#FFE0A0" stop-opacity=".6"/>
      <stop offset=".25" stop-color="#FFC27A" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#F09A6A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E08A6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="130" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7B27A" stop-opacity="0"/>
      <stop offset=".45" stop-color="#FFC284" stop-opacity=".16"/>
      <stop offset=".58" stop-color="#FFCB8C" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#E9A27E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C98A80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".62" stop-color="#fff"/>
    </linearGradient>
    <mask id="lean" maskUnits="userSpaceOnUse" x="0" y="130" width="960" height="280">
      <rect x="0" y="130" width="960" height="280" fill="url(#side)"/>
    </mask>
  </defs>
  <rect x="0" y="130" width="960" height="280" fill="url(#band)" mask="url(#lean)"/>
  <rect x="0" y="130" width="960" height="280" fill="url(#bloom)"/>
</svg>
