<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="-4 250 968 190" data-scale="1">
  <!-- Luminous fog lying over the far mesas and the back of the prairie, warm where the sun comes through. -->
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF5E8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FAF5E8" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F6F2E6" stop-opacity="0.8"/>
      <stop offset="0.85" stop-color="#F0EEE4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F0EEE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="-4" y="250" width="968" height="190" fill="url(#side)"/></mask>
  </defs>
  <rect x="-4" y="250" width="968" height="190" fill="url(#fog)" mask="url(#m)"/>
</svg>
