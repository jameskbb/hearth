<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" data-scale="1">
  <!-- Bright overcast over the prairie: a soft steel-blue ceiling, pearl through the middle, a warm cream horizon where the sun is. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6187"/>
      <stop offset="0.22" stop-color="#5A85A4"/>
      <stop offset="0.48" stop-color="#A6BCC2"/>
      <stop offset="0.72" stop-color="#DCDCC8"/>
      <stop offset="1" stop-color="#F1DDB0"/>
    </linearGradient>
    <radialGradient id="warm" cx="86%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFF1CC" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#FBE6BC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FBE6BC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceiling" cx="8%" cy="0%" r="60%">
      <stop offset="0" stop-color="#255A82" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2F6187" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2F6187" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftcool" x1="0.1" y1="0" x2="0.9" y2="0">
      <stop offset="0" stop-color="#7C9CB0" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#8FA9B6" stop-opacity="0.22"/>
      <stop offset="0.75" stop-color="#8FA9B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <ellipse cx="220" cy="160" rx="280" ry="30" fill="#C4D2D6" opacity="0.3"/>
    <ellipse cx="640" cy="128" rx="300" ry="28" fill="#EEF0E8" opacity="0.28"/>
    <ellipse cx="460" cy="236" rx="330" ry="26" fill="#E8EAE0" opacity="0.3"/>
    <ellipse cx="820" cy="290" rx="220" ry="24" fill="#FAF0D8" opacity="0.32"/>
    <ellipse cx="380" cy="60" rx="320" ry="24" fill="#4B7699" opacity="0.24"/>
  </g>
  <rect x="-120" y="220" width="1200" height="200" fill="url(#leftcool)" filter="url(#soft)"/>
  <rect width="960" height="540" fill="url(#ceiling)"/>
  <rect width="960" height="540" fill="url(#warm)"/>
</svg>
