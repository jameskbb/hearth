      <path d="M440 132 C470 120 500 126 524 118 C546 104 574 110 590 104 C610 90 640 94 656 106 C680 100 712 110 724 122 C756 118 788 128 806 140 C830 138 858 144 876 152 C810 160 740 154 680 158 C620 162 560 154 500 154 C474 152 456 142 440 132Z" opacity="0.76"/>
      <path d="M200 214 C230 204 260 210 284 204 C310 196 336 202 352 208 C380 204 408 210 424 216 C360 222 280 220 200 214Z" opacity="0.48"/>
