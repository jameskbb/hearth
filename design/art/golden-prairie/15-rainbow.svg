<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 100 960 250" data-scale="1">
  <!-- After the rain: silver shower veils trailing from the clouds and a soft rainbow standing over the mesas. -->
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3DCE0" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#C8D3DA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C8D3DA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="100" x2="0" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="fade"><rect x="0" y="100" width="960" height="250" fill="url(#foot)"/></mask>
    <filter id="soft" x="-30%" y="-20%" width="160%" height="140%"><feGaussianBlur stdDeviation="14 6"/></filter>
    <filter id="bow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
