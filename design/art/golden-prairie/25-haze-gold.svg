<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="-7 180 974 280" data-scale="1">
  <!-- High summer: an apricot low sky, thick golden heat haze over the mesas, a shimmer band above the far prairie and the grass bleached pale gold. Drawn over the prairie. -->
