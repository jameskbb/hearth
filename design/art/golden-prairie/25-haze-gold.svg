    <linearGradient id="gold" x1="0" y1="180" x2="0" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9A6" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#FFD7A2" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#FCE0A0" stop-opacity="0.62"/>
      <stop offset="0.6" stop-color="#FAE3A4" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#F7E6AC" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F4E3A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="-7" y="180" width="974" height="280" fill="url(#side)"/></mask>
