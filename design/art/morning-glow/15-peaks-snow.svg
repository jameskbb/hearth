<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="-4 170 968 370" data-scale="1">
  <!-- Morning Glow weather layer: fresh snow on the ranges, over mountains.webp with the same placement.
       Drawn at half size (data-scale 1). The far peaks whiten from the summits down, warm where the sunrise
       reaches them; the ridge in front lies under snow, its left side in cool shade, with the sunrise's band across it. -->
  <defs>
    <clipPath id="farRange">
      <path d="M-8 296 L19 287 L42 264 L58 268 L89 242 L106 251 L119 236 L132 251 L151 263 L162 260 L187 280 L209 285 L229 273 L252 295 L279 301 L301 291 L326 309 L358 306 L382 320 L421 315 L451 326 L486 319 L520 330 L557 312 L580 307 L604 290 L621 296 L646 285 L668 296 L690 292 L721 271 L743 268 L761 252 L779 264 L794 259 L820 276 L841 285 L858 279 L890 296 L919 285 L944 294 L968 281 L968 540 L-8 540Z"/>
    </clipPath>
    <clipPath id="midRidge">
      <path d="M-8 338 C38 322 64 315 103 329 C144 343 169 337 201 351 C242 369 278 356 314 373 C357 392 399 385 444 390 C488 393 519 374 558 367 C605 361 639 340 678 342 C718 346 744 319 784 326 C829 334 864 314 900 320 C928 325 950 315 968 311 L968 540 L-8 540Z"/>
    </clipPath>
    <linearGradient id="cap" x1="0" y1="236" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFAF7" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#E8EDF2" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#C6D2DE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A9B8CA" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="dust" x1="0" y1="310" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF0F1" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#CBD5E0" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#97A9C0" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0E4DA" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#FFE2B8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFE6C0" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="sunlit" cx="666" cy="285" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE0B0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFE0B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="snowedge" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".06 .12" numOctaves="2" seed="12" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="onSnow" maskUnits="userSpaceOnUse" x="-8" y="170" width="976" height="370">
      <rect x="-8" y="230" width="976" height="170" fill="url(#cap)" filter="url(#snowedge)"/>
    </mask>
    <linearGradient id="ridgeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7684A8" stop-opacity="0.8"/>
      <stop offset="0.38" stop-color="#7684A8" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#7684A8" stop-opacity="0.1"/>
      <stop offset="0.7" stop-color="#7684A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rangeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8794B4" stop-opacity="0.55"/>
      <stop offset="0.38" stop-color="#8794B4" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#8794B4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#farRange)">
    <rect x="-8" y="230" width="976" height="170" fill="url(#cap)" filter="url(#snowedge)"/>
    <rect x="-8" y="230" width="976" height="110" fill="url(#sunlit)" mask="url(#onSnow)"/>
  </g>
  <g clip-path="url(#midRidge)">
    <rect x="-8" y="300" width="976" height="240" fill="url(#dust)"/>
    <!-- The ridge's shaded left side, a cool mid-tone behind the focused app name. -->
    <rect x="-8" y="300" width="976" height="240" fill="url(#ridgeShade)"/>
  </g>
  <g clip-path="url(#farRange)">
    <rect x="-8" y="288" width="976" height="120" fill="url(#rangeShade)"/>
  </g>
  <!-- The sunrise's warm band across the snowy ridge, as on the base. -->
  <path d="M-8 368 C90 340 165 378 240 386 C329 394 361 418 445 413 C539 406 599 373 676 369 C789 365 856 339 968 351 L968 405 C839 389 769 406 674 405 C571 409 515 440 418 439 C300 437 211 407 128 402 C68 398 25 399 -8 408Z" fill="url(#light)" opacity="0.5"/>
</svg>
