<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-scale="1">
  <!-- Morning Glow weather sky: a soft pearl cloud deck for overcast, rain and fog mornings. An opaque sky drawn at half size over the base sky (data-scale 1). Silver-blue overhead, pearl toward the horizon, and the sunrise still breaking through low and warm. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30527A"/>
      <stop offset="0.3" stop-color="#6A86A0"/>
      <stop offset="0.5" stop-color="#C3C4C2"/>
      <stop offset="0.6" stop-color="#EBC9A3"/>
      <stop offset="1" stop-color="#DFAE78"/>
    </linearGradient>
    <radialGradient id="sunwash" cx="69%" cy="53%" r="38%">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.92"/>
      <stop offset="0.14" stop-color="#FFE3A6" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#FFD9A0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C5D0"/>
      <stop offset="0.6" stop-color="#9DAEBF"/>
      <stop offset="1" stop-color="#8496AB"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/>
      <stop offset="0.6" stop-color="#DCD8D2"/>
      <stop offset="1" stop-color="#E8C9A6"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E4"/>
      <stop offset="0.55" stop-color="#F6E0C2"/>
      <stop offset="1" stop-color="#F2C08A"/>
    </linearGradient>
    <linearGradient id="snowdeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDF2"/>
      <stop offset="0.6" stop-color="#CBD3DD"/>
      <stop offset="1" stop-color="#C2C8D3"/>
    </linearGradient>
    <radialGradient id="calm" cx="150" cy="70" r="330" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 70) scale(1.5 1) translate(-150 -70)">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <!-- Clouds thin a little behind the clock so it reads as it does on the base. -->
    <mask id="clock" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="540">
      <rect width="960" height="540" fill="url(#calm)"/>
    </mask>
    <filter id="disc" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b2" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b3" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b4" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b5" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="b6" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
