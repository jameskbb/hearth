    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.12"/>
      <stop offset="0.3" stop-color="#FFD98A" stop-opacity="0.42"/>
      <stop offset="0.68" stop-color="#FFE2A0" stop-opacity="0.85"/>
      <stop offset="0.9" stop-color="#FFD98A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="fogsoft" x="-10%" y="-50%" width="120%" height="200%">
