<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="-10 300 980 240" data-scale="1">
  <!-- Morning Glow weather layer: hoarfrost on the hills, over hills.webp with the same placement, drawn at
       half size (data-scale 1). The grass silvers: a pale blue-green frost settles over the shaded faces and
       hollows below each crest, strongest on the left away from the sun, while the sun-facing crests keep
       their green and gold. A few ice sparkles sit inside the frosted areas. -->
  <defs>
    <linearGradient id="away" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.68" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <mask id="shadowSide" maskUnits="userSpaceOnUse" x="-60" y="300" width="1080" height="260">
      <rect x="-60" y="300" width="1080" height="260" fill="url(#away)"/>
    </mask>
    <!-- On the near hill the frost stays a band below the crest, clear of the action row. -->
    <mask id="frontBand" maskUnits="userSpaceOnUse" x="-60" y="300" width="1080" height="260">
      <path d="M-12 445 C55 427 104 441 151 446 C232 456 282 476 345 483 C437 492 514 474 588 466 C673 456 722 452 788 429 C852 408 911 408 972 418 L972 540 L-12 540Z" transform="translate(0 6)" fill="#fff"/>
      <path d="M-12 445 C55 427 104 441 151 446 C232 456 282 476 345 483 C437 492 514 474 588 466 C673 456 722 452 788 429 C852 408 911 408 972 418 L972 540 L-12 540Z" transform="translate(0 26)" fill="#000" filter="url(#settle)"/>
    </mask>
    <!-- The far hill shows only above the near one. -->
    <mask id="aboveFront" maskUnits="userSpaceOnUse" x="-60" y="300" width="1080" height="260">
      <rect x="-60" y="300" width="1080" height="260" fill="#fff"/>
      <path d="M-12 445 C55 427 104 441 151 446 C232 456 282 476 345 483 C437 492 514 474 588 466 C673 456 722 452 788 429 C852 408 911 408 972 418 L972 540 L-12 540Z" fill="#000"/>
    </mask>
    <clipPath id="backHill"><path d="M-12 366 C57 358 106 383 165 398 C237 417 293 421 349 432 C420 443 475 442 530 425 C609 400 647 386 708 383 C792 380 851 348 909 349 C936 350 954 359 972 356 L972 540 L-12 540Z"/></clipPath>
    <clipPath id="frontHill"><path d="M-12 445 C55 427 104 441 151 446 C232 456 282 476 345 483 C437 492 514 474 588 466 C673 456 722 452 788 429 C852 408 911 408 972 418 L972 540 L-12 540Z"/></clipPath>
    <filter id="settle" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glint" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.25"/></filter>
  </defs>
  <g mask="url(#shadowSide)">
    <g clip-path="url(#backHill)" mask="url(#aboveFront)">
      <path d="M-12 366 C57 358 106 383 165 398 C237 417 293 421 349 432 C420 443 475 442 530 425 C609 400 647 386 708 383 C792 380 851 348 909 349 C936 350 954 359 972 356 L972 540 L-12 540Z" transform="translate(0 16)" fill="#BCCCC8" opacity="0.72" filter="url(#settle)"/>
    </g>
