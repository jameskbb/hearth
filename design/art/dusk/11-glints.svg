<svg xmlns="http://www.w3.org/2000/svg" width="960" height="164" viewBox="0 286 960 164">
  <!-- Hearth theme "Dusk", weather layer 11: rain-washed crests catching the low sun, on transparent.
       Rendered by scripts/render-theme.sh dusk. A hairline of wet light along each crest, cut from the same
       paths and ridge filter as layer 00, warm and strongest toward the sun. -->
  <defs>
    <filter id="ridge" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .05" numOctaves="4" seed="3" result="t"/>
