<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 150 960 240" data-scale="1">
  <!-- Hearth theme "Dusk", weather layer 17: the hush before snow, on transparent. Rendered at a quarter size (480 px wide)
       by scripts/render-theme.sh dusk and scaled up. A soft pearl-rose veil over the lower sky and the far
       ridges, as when a snow sky holds the last light: the amber band softens to pink and the far hills go
       pale. It thins toward the left, where the app name sits. Also lies over the fog. -->
  <defs>
    <linearGradient id="veil" x1="0" y1="150" x2="0" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8B4D4" stop-opacity="0"/>
      <stop offset=".35" stop-color="#D8BCD0" stop-opacity=".32"/>
      <stop offset=".62" stop-color="#F0CCCC" stop-opacity=".42"/>
      <stop offset=".78" stop-color="#E0C6DC" stop-opacity=".34"/>
      <stop offset="1" stop-color="#B8B0DA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="652" cy="300" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(652 300) scale(1.3 .28) translate(-652 -300)">
      <stop offset="0" stop-color="#FFE8D0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFE8D0" stop-opacity="0"/>
    </radialGradient>
    <!-- thinner toward the left, where the app name sits over the far ridges -->
    <linearGradient id="side" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".62" stop-color="#fff"/>
    </linearGradient>
    <mask id="lean" maskUnits="userSpaceOnUse" x="0" y="150" width="960" height="240">
      <rect x="0" y="150" width="960" height="240" fill="url(#side)"/>
    </mask>
  </defs>
  <rect x="0" y="150" width="960" height="240" fill="url(#veil)" mask="url(#lean)"/>
  <rect x="0" y="150" width="960" height="240" fill="url(#sun)"/>
</svg>
